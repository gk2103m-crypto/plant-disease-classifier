<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agricultural Diagnostic System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800">
    <main class="max-w-6xl mx-auto py-12 px-6">
        <header class="mb-10 border-b border-gray-200 pb-6">
            <h1 class="text-3xl font-semibold text-gray-900">Agricultural Diagnostic System</h1>
            <p class="text-gray-500 mt-2 text-sm">Automated Pathology Classification and Remediation Engine</p>
        </header>
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
            <section class="bg-white p-8 rounded-lg shadow-sm border border-gray-200">
                <h2 class="text-lg font-medium text-gray-900 mb-6">New Diagnostic Scan</h2>
                
                <form id="diagnosticForm" class="space-y-6">
                    <div class="border border-dashed border-gray-300 bg-gray-50 rounded-md p-8 text-center hover:bg-gray-100 transition-colors">
                        <label for="imageUpload" class="block text-sm font-medium text-gray-700 mb-2">Upload Specimen Image</label>
                        <input type="file" id="imageUpload" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-medium file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer" required>
                    </div>
                    
                    <button type="submit" id="processBtn" class="w-full bg-blue-600 text-white font-medium py-2.5 px-4 rounded-md hover:bg-blue-700 transition duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        Execute Analysis
                    </button>
                </form>
                
                <div id="resultsContainer" class="mt-8 hidden border-t border-gray-200 pt-6">
                    <div class="mb-4">
                        <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Classification Result</h3>
                        <p id="diseaseOutput" class="text-xl font-medium text-gray-900 mt-1"></p>
                        <p id="confidenceOutput" class="text-sm text-gray-600 mt-1"></p>
                    </div>
                    
                    <div>
                        <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Recommended Remediation</h3>
                        <p id="treatmentOutput" class="text-sm text-gray-800 mt-2 leading-relaxed bg-gray-50 p-4 rounded-md border border-gray-100"></p>
                    </div>
                </div>
            </section>

            <section class="bg-white p-8 rounded-lg shadow-sm border border-gray-200">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-medium text-gray-900">System History</h2>
                    <button id="refreshBtn" class="text-sm text-blue-600 hover:text-blue-800 font-medium">Refresh Records</button>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead>
                            <tr>
                                <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Pathology</th>
                                <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Remediation Strategy</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody" class="bg-white divide-y divide-gray-200 text-sm">
                            </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('diagnosticForm');
            const processBtn = document.getElementById('processBtn');
            const resultsContainer = document.getElementById('resultsContainer');
            const refreshBtn = document.getElementById('refreshBtn');

            /**
             * Handles the diagnostic form submission and API integration.
             */
            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                
                const fileInput = document.getElementById('imageUpload');
                if (!fileInput.files.length) return;

                // Update UI state to represent processing
                const originalBtnText = processBtn.innerText;
                processBtn.innerText = "Processing Telemetry...";
                processBtn.disabled = true;

                const payload = new FormData();
                payload.append('file', fileInput.files[0]);

                try {
                    const response = await fetch('/api/predict', {
                        method: 'POST',
                        body: payload
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    displayResults(data);
                    fetchSystemHistory();
                } catch (error) {
                    console.error('Diagnostic execution failed:', error);
                    alert('An error occurred during processing. Please review console logs.');
                } finally {
                    // Restore UI state
                    processBtn.innerText = originalBtnText;
                    processBtn.disabled = false;
                }
            });

            refreshBtn.addEventListener('click', fetchSystemHistory);

            /**
             * Renders the classification and remediation payload to the DOM.
             */
            function displayResults(data) {
                document.getElementById('diseaseOutput').textContent = data.disease;
                document.getElementById('confidenceOutput').textContent = `Confidence Score: ${(data.confidence).toFixed(2)}%`;
                document.getElementById('treatmentOutput').textContent = data.treatment_plan;
                resultsContainer.classList.remove('hidden');
            }

            /**
             * Retrieves and renders the recent diagnostic records from the persistence layer.
             */
            async function fetchSystemHistory() {
                try {
                    const response = await fetch('/api/history');
                    if (!response.ok) throw new Error('Failed to fetch historical data');
                    
                    const records = await response.json();
                    const tableBody = document.getElementById('historyTableBody');
                    tableBody.innerHTML = '';
                    
                    records.forEach(record => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td class="px-4 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${record.disease}</td>
                            <td class="px-4 py-4 text-sm text-gray-500">${record.treatment_plan}</td>
                        `;
                        tableBody.appendChild(row);
                    });
                } catch (error) {
                    console.error('History retrieval failed:', error);
                }
            }

            // Initialize data table on load
            fetchSystemHistory();
        });
    </script>
</body>
</html>
